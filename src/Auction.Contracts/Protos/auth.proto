syntax = "proto3";

option csharp_namespace = "Auction.Contracts";
package auction.v1;

import "google/protobuf/empty.proto";

// Public sign-up and sign-in. Only GetMe needs an access token.
service AuthService {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout (LogoutRequest) returns (google.protobuf.Empty);
  rpc GetMe (google.protobuf.Empty) returns (Me);

  // Appeals (spec 10 R7). No sign-in: email and password prove who you are; wrong passwords count as failed logins.
  rpc SubmitAppeal (SubmitAppealRequest) returns (AppealStatus);
  rpc GetAppealStatus (AppealLoginRequest) returns (AppealStatus);

  // Become a seller (design W9). Signed in. An admin approves in AdminService.ReviewSellerApplication.
  rpc ApplyForSeller (ApplyForSellerRequest) returns (SellerApplication);
  rpc GetSellerApplication (google.protobuf.Empty) returns (SellerApplication);
}

message RegisterRequest {
  string username = 1;   // 3 to 32: letters, digits, _
  string email = 2;
  string password = 3;   // 12+ characters
}

message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthTokens {
  string access_token = 1;
  int64 access_expires_ms = 2;
  string refresh_token = 3;
  int64 refresh_expires_ms = 4;
}

message LoginResponse {
  AuthTokens tokens = 1;
  Me me = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  AuthTokens tokens = 1;
  Me me = 2;   // who the new tokens are for, with current roles (lets the web pick up a new Seller role)
}

message LogoutRequest {
  string refresh_token = 1;
}

message Me {
  string user_id = 1;
  string username = 2;
  string email = 3;
  repeated string roles = 4;     // Bidder, Seller, Admin
  string status = 5;             // Active, Suspended, Banned, PendingVerification
  int32 status_version = 6;
  int32 active_strikes = 7;     // spec 10: unpaid wins not cleared by an appeal (3 = suspended)
}

message SubmitAppealRequest {
  string email = 1;
  string password = 2;
  string message = 3;     // 20 to 2000 characters
}

message AppealLoginRequest {
  string email = 1;
  string password = 2;
}

message AppealStatus {
  string user_status = 1;       // Active, Suspended, ...
  int32 active_strikes = 2;
  string appeal_status = 3;     // None, Open, Accepted, Rejected (the latest appeal)
  string admin_note = 4;
  int64 created_at_ms = 5;
  int64 resolved_at_ms = 6;
}
message ApplyForSellerRequest {
  string display_name = 1;   // the shop name, 3 to 40 characters
}

message SellerApplication {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string status = 4;          // None, Applied, Verified, Rejected, Revoked
  string display_name = 5;
  string reject_reason = 6;
  bool is_seller = 7;
}