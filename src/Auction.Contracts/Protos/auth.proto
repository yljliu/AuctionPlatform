syntax = "proto3";

option csharp_namespace = "Auction.Contracts";
package auction.v1;

import "google/protobuf/empty.proto";

// Public sign-up and sign-in. Only GetMe needs an access token.
service AuthService {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout (LogoutRequest) returns (google.protobuf.Empty);
  rpc GetMe (google.protobuf.Empty) returns (Me);
}

message RegisterRequest {
  string username = 1;   // 3 to 32: letters, digits, _
  string email = 2;
  string password = 3;   // 12+ characters
}

message RegisterResponse {
  string user_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthTokens {
  string access_token = 1;
  int64 access_expires_ms = 2;
  string refresh_token = 3;
  int64 refresh_expires_ms = 4;
}

message LoginResponse {
  AuthTokens tokens = 1;
  Me me = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  AuthTokens tokens = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message Me {
  string user_id = 1;
  string username = 2;
  string email = 3;
  repeated string roles = 4;     // Bidder, Seller, Admin
  string status = 5;             // Active, Suspended, Banned, PendingVerification
  int32 status_version = 6;
}
