syntax = "proto3";

option csharp_namespace = "Auction.Contracts";
package auction.v1;

// Money: units = whole part, nanos = fraction in 1e-9 (same idea as google.type.Money).
message Money {
  string currency = 1;
  int64 units = 2;
  int32 nanos = 3;
}

message FieldError {
  string field = 1;
  string rule = 2;
  string message = 3;
}

// Sent with every failed call as the binary trailer "error-detail-bin".
message ErrorDetail {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  string correlation_id = 4;
  repeated FieldError fields = 5;
  int64 retry_after_ms = 6;
}
