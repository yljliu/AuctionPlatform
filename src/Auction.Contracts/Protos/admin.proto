syntax = "proto3";

option csharp_namespace = "Auction.Contracts";
package auction.v1;

import "google/protobuf/empty.proto";
import "catalog.proto";
import "auth.proto";

// Admin only. Users (spec 01) and auction control (spec 05). More methods come in spec 08.
service AdminService {
  rpc BanUser (BanUserRequest) returns (google.protobuf.Empty);
  rpc SuspendUser (SuspendUserRequest) returns (google.protobuf.Empty);

  // Spec 05: each writes an AuditLog row. INVALID_STATE when the auction is not in a status that allows it.
  rpc ForceCancelAuction (AuctionActionRequest) returns (google.protobuf.Empty);   // even with bids
  rpc ForceCloseAuction (AuctionActionRequest) returns (google.protobuf.Empty);    // end now; it seals next
  rpc FreezeAuction (AuctionActionRequest) returns (google.protobuf.Empty);        // bids get AUCTION_FROZEN
  rpc ResumeAuction (AuctionActionRequest) returns (google.protobuf.Empty);        // end moves later by the frozen time

  // Spec 06: admin pages.
  rpc ReinstateUser (ReinstateUserRequest) returns (google.protobuf.Empty);
  rpc SearchUsers (SearchUsersRequest) returns (SearchUsersResponse);
  rpc ListAuctions (AdminListAuctionsRequest) returns (ListAuctionsResponse);   // any status, Frozen and Cancelled too
  rpc GetStats (GetStatsRequest) returns (AdminStats);

  // Spec 08: simulator helpers and system stats.
  // Creates missing bot users bot_0001.. (IsBot, role Bidder) and signs each one in; returns their tokens.
  rpc CreateBots (CreateBotsRequest) returns (CreateBotsResponse);
  // Scheduled auctions owned by a seeded seller, with a drawn photo; the lifecycle leader opens them.
  rpc CreateDemoAuctions (CreateDemoAuctionsRequest) returns (CreateDemoAuctionsResponse);
  rpc GetSystemStats (GetSystemStatsRequest) returns (SystemStats);

  // Appeals from suspended users (spec 10 R7.4 to R7.6).
  rpc ListAppeals (ListAppealsRequest) returns (ListAppealsResponse);
  rpc ResolveAppeal (ResolveAppealRequest) returns (google.protobuf.Empty);

  // Seller applications (design W9).
  rpc ListSellerApplications (google.protobuf.Empty) returns (ListSellerApplicationsResponse);
  rpc ReviewSellerApplication (ReviewSellerApplicationRequest) returns (google.protobuf.Empty);
}

message AuctionActionRequest {
  string auction_id = 1;
  string reason = 2;
}

message BanUserRequest {
  string user_id = 1;
  string reason = 2;
}

message SuspendUserRequest {
  string user_id = 1;
  int64 until_ms = 2;
  string reason = 3;
}

// ---------- spec 06 ----------

message ReinstateUserRequest {
  string user_id = 1;
  string reason = 2;
}

message SearchUsersRequest {
  string query = 1;      // part of the username or email; empty = newest
  int32 page = 2;
  int32 page_size = 3;
}

message AdminUserRow {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string status = 4;             // Active, Suspended, Banned, PendingVerification
  int64 suspended_until_ms = 5;
  repeated string roles = 6;
  int64 created_at_ms = 7;
}

message SearchUsersResponse {
  repeated AdminUserRow users = 1;
  int32 total = 2;
}

message AdminListAuctionsRequest {
  string status = 1;     // empty = Live
  string query = 2;      // words in the title or description; empty = all
  int32 page = 3;
  int32 page_size = 4;
}

message GetStatsRequest {}

message AdminStats {
  int32 live_auctions = 1;
  int32 scheduled_auctions = 2;
  int32 sealed_auctions = 3;      // waiting to settle
  int32 frozen_auctions = 4;
  int32 users = 5;
  int32 bids_last_15_min = 6;
  repeated int32 bids_per_minute = 7;   // last 15 minutes, oldest first
  bool sql_ok = 8;
  bool redis_ok = 9;
  int64 redis_latency_ms = 10;
  string lifecycle_leader = 11;   // workers copy holding the lease, or empty
}

// ---------- spec 08 ----------

message CreateBotsRequest {
  int32 count = 1;   // 1 to 1000
}

message BotSession {
  string user_id = 1;
  string username = 2;
  AuthTokens tokens = 3;
}

message CreateBotsResponse {
  repeated BotSession bots = 1;
}

message CreateDemoAuctionsRequest {
  int32 count = 1;                    // 1 to 100
  int32 starts_in_sec = 2;            // 5 to 3600
  int32 duration_sec = 3;             // 60 to 86400; all end together
  string seller = 4;                  // username; empty = seller1
  int32 snipe_window_sec = 5;         // 0 = 60
  int32 extension_sec = 6;            // 0 = 60
  int32 max_total_extension_sec = 7;  // 0 = 600
  string title_prefix = 8;            // empty = "Demo lot"
}

message CreateDemoAuctionsResponse {
  repeated string auction_ids = 1;
}

message GetSystemStatsRequest {}

// Numbers the Prometheus part could not get are -1 (the page shows "-").
message SystemStats {
  double bids_per_sec = 1;
  int32 live_auctions = 2;
  int32 online_users = 3;
  double persist_lag_ms = 4;
  double error_rate = 5;          // 0..1 over the last minute
  double p99_bid_latency_ms = 6;
  double redis_memory_pct = 7;    // used / maxmemory; -1 when no limit is set
  int64 redis_memory_bytes = 8;
  int32 redis_replicas = 9;
  bool prometheus_ok = 10;
  repeated ServiceHealth services = 11;
  int64 at_ms = 12;
}

message ServiceHealth {
  string service = 1;   // api, workers, web, simulator
  int32 healthy = 2;
  int32 total = 3;
}

// ---------- appeals (spec 10) ----------

message ListAppealsRequest {
  bool open_only = 1;
}

message AppealStrike {
  string settlement_id = 1;
  string title = 2;
  int64 created_at_ms = 3;
}

message AppealRow {
  int64 appeal_id = 1;
  string user_id = 2;
  string username = 3;
  string email = 4;
  string user_status = 5;
  string suspend_reason = 6;
  repeated AppealStrike strikes = 7;
  string message = 8;
  string status = 9;          // Open, Accepted, Rejected
  string admin_note = 10;
  int64 created_at_ms = 11;
  int64 resolved_at_ms = 12;
}

message ListAppealsResponse {
  repeated AppealRow rows = 1;
}

message ResolveAppealRequest {
  int64 appeal_id = 1;
  bool accept = 2;
  string note = 3;            // required to reject
}
// ---------- seller applications (design W9) ----------

message ListSellerApplicationsResponse {
  repeated SellerApplication rows = 1;
}

message ReviewSellerApplicationRequest {
  string user_id = 1;
  bool approve = 2;
  string reason = 3;          // required to reject
}