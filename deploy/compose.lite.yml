# Dev stack for a low-memory PC: one copy of each app.
# Run from the repo root:
#   docker compose --env-file .env -f deploy/compose.lite.yml up -d --build
# Web site: http://localhost:5001    Logs (Seq): http://localhost:8081
name: auction-lite

x-app-env: &app-env
  ConnectionStrings__Sql: "Server=sqlserver,1433;Database=Auction;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
  ConnectionStrings__Redis: "redis:6379,abortConnect=false"
  Seq__Url: "http://seq:5341"

x-after-db: &after-db
  sqlserver:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrator:
    condition: service_completed_successfully

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.2
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrator:
    build:
      context: ..
      dockerfile: src/Auction.Migrator/Dockerfile
    image: auction-migrator:dev
    environment:
      ConnectionStrings__Sql: "Server=sqlserver,1433;Database=Auction;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      SEED_PASSWORD: ${SEED_PASSWORD}
      Images__Path: /data/images   # demo photos go where the Api reads them (spec 07 demo data)
    volumes:
      - images:/data/images
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: src/Auction.Api/Dockerfile
    image: auction-api:dev
    environment:
      <<: *app-env
      INSTANCE_NAME: api-1
      JWT__SigningKey: ${JWT__SigningKey}
      Images__Path: /data/images
      SystemStats__Health__0: "api=http://localhost:7080/health/ready"   # admin page (spec 08); no Prometheus in lite
      SystemStats__Health__1: "workers=http://workers:7101/health/ready"
      SystemStats__Health__2: "web=http://web:8080/health/ready"
      SystemStats__Health__3: "simulator=http://simulator:7202/health/ready"
    ports:
      - "7001:7001"   # gRPC, for local tools only
    volumes:
      - images:/data/images
    depends_on: *after-db
    healthcheck:
      test: ["CMD", "dotnet", "Auction.Api.dll", "--probe", "http://localhost:7080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  workers:
    build:
      context: ..
      dockerfile: src/Auction.Workers/Dockerfile
    image: auction-workers:dev
    environment:
      <<: *app-env
      INSTANCE_NAME: workers-1
    depends_on: *after-db
    healthcheck:
      test: ["CMD", "dotnet", "Auction.Workers.dll", "--probe", "http://localhost:7101/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    build:
      context: ..
      dockerfile: src/Auction.Web/Dockerfile
    image: auction-web:dev
    environment:
      INSTANCE_NAME: web-1
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      Seq__Url: "http://seq:5341"
      Api__Endpoints__0: "http://api:7001"
      DataProtection__KeysPath: /keys
      Simulator__Url: "http://simulator:7201"   # admin simulator panel (spec 08)
      Demo__Enabled: "true"            # quick login on the sign-in page (spec 06 R7.1)
      Demo__Password: "${SEED_PASSWORD:-}"   # demo users' password; stays on the server
    ports:
      - "5001:8080"
    volumes:
      - dp-keys:/keys
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Auction.Web.dll", "--probe", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  simulator:
    build:
      context: ..
      dockerfile: src/Auction.Simulator/Dockerfile
    image: auction-simulator:dev
    environment:
      <<: *app-env
      INSTANCE_NAME: simulator
      JWT__SigningKey: ${JWT__SigningKey}   # checks admin tokens (spec 08)
      Api__Endpoints__0: "http://api:7001"
    ports:
      - "7201:7201"   # gRPC, for the admin page and scripts\sim-check.ps1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Auction.Simulator.dll", "--probe", "http://localhost:7202/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  seq:
    image: datalust/seq:2024
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq-data:/data

volumes:
  sql-data:
  redis-data:
  seq-data:
  dp-keys:
  images:
